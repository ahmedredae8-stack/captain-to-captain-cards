<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لمعة السفينة الذهبي — مؤثرات المستوى الأول</title>
<style>
:root{--bg:#0e2a3a;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
canvas{max-width:94%;height:auto}
label{font-size:14px;display:flex;gap:8px;align-items:center}

body{justify-content:flex-start;overflow-x:hidden;padding:14px 10px 20px;gap:12px}
canvas{display:block;width:min(94vw,900px);height:auto;flex:0 0 auto;background:transparent}
.ship-panel{width:min(94vw,520px);box-sizing:border-box;padding:13px 15px;border:1px solid rgba(246,194,75,.32);border-radius:16px;background:linear-gradient(145deg,rgba(18,54,69,.96),rgba(9,31,44,.96));box-shadow:0 12px 32px rgba(0,0,0,.25);color:#fff}
.panel-heading{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.panel-heading strong{color:#ffd36e;font-size:17px}
.panel-heading span{font-size:12px;color:#bfd4dd}
.panel-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ship-panel label{display:flex;flex-direction:column;align-items:stretch;gap:5px;font-size:12px;color:#d9e7ec}
.ship-panel select{width:100%;min-height:40px;padding:7px 10px;border:1px solid rgba(246,194,75,.36);border-radius:10px;background:#102f40;color:#fff;font:inherit;font-size:14px}
.ship-panel select:focus-visible{outline:2px solid #ffd36e;outline-offset:2px}
#effectHint{margin:9px 0 0;min-height:1.4em;color:#c6dce3;font-size:12px}
#replayFx{width:100%;margin-top:9px;padding:10px;border:0;border-radius:10px;background:linear-gradient(100deg,#f4d18a,#d5a344);color:#35250c;font:600 14px system-ui;cursor:pointer}
#replayFx:focus-visible{outline:2px solid #fff;outline-offset:2px}
body>label{padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.07);font-size:13px}
body>label input{accent-color:#f6c24b}
@media(max-width:420px){.panel-heading{align-items:flex-start;flex-direction:column;gap:2px}.panel-fields{grid-template-columns:1fr 1fr}.ship-panel{padding:11px}}
</style></head><body>
<canvas id="c" aria-label="معاينة تأثيرات السفينة"></canvas>
<section class="ship-panel" aria-label="إعدادات السفينة">
  <div class="panel-heading"><strong>لمعة السفينة الذهبي</strong><span>المستوى الأول — اختر السفينة والحالة</span></div>
  <div class="panel-fields">
    <label for="shipLevel">سفينة المستوى الأول
      <select id="shipLevel" aria-label="السفينة">
        <option value="0">لمعة الأصلية — صورة المشروع</option>
        <option value="1">السفينة ١</option><option value="2">السفينة ٢</option>
        <option value="3">السفينة ٣</option><option value="4">السفينة ٤</option>
        <option value="5">السفينة ٥</option><option value="6">السفينة ٦</option>
        <option value="7">السفينة ٧</option><option value="8">السفينة ٨</option>
        <option value="9">السفينة ٩</option><option value="10">سفينة الزعيم ١٠</option>
      </select>
    </label>
    <label for="shipMode">حالة السفينة
      <select id="shipMode" aria-label="حالة السفينة">
        <option value="shine">لمعة ذهبية</option>
        <option value="none">بدون تأثير</option>
        <option value="repair">قيد الإصلاح</option>
        <option value="damaged">متضررة</option>
        <option value="destroyed">مدمّرة</option>
      </select>
    </label>
  </div>
  <p id="effectHint" aria-live="polite">لمعان ذهبي متحرك للسفينة.</p>
  <button id="replayFx" type="button">إعادة عرض التأثير</button>
</section>
<label>السرعة <input id="sp" type="range" min="0.3" max="2.5" step="0.1" value="1"></label>
<label>القوة <input id="st" type="range" min="0.3" max="2.5" step="0.1" value="1.3"></label>
<script>
var visualMode='shine', shipLevel=1, modeStartedAt=performance.now(), repairFromBroken=false;
function clampFx(v,a,b){return Math.max(a,Math.min(b,v));}
function smoothFx(v){v=clampFx(v,0,1);return v*v*(3-2*v);}
function effectPower(strength){const lv=clampFx(Number(shipLevel)||1,1,10);return Math.min(2.25,(.70+lv*.03)*(Number(strength)||1));}
function drawRepairSpiral(ctx,W,H,now,front,power){
 const elapsed=(now-modeStartedAt)/1000,delay=repairFromBroken?.90:.10,rise=smoothFx((elapsed-delay)/1.78);if(rise<.01)return;
 const cx=W*.5,steps=Math.max(8,Math.floor(rise*190)),activation=Math.min(.95,(front?.62:.28)*power*(.35+.65*rise));ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
 for(let strand=0;strand<1;strand++){
  const phase=strand?2.15:0;ctx.beginPath();let drawing=false;
  for(let i=0;i<=steps;i++){
   const u=rise*i/steps,theta=u*Math.PI*2*1.18+phase-now*.0019,depth=Math.cos(theta),isFront=depth>0;
   if(isFront!==front){drawing=false;continue;}
   const rx=W*(.13+.24*Math.sin(Math.PI*u)),px=cx+Math.sin(theta)*rx,py=H*(.95-.74*u);
   if(!drawing){ctx.moveTo(px,py);drawing=true;}else ctx.lineTo(px,py);
  }
  ctx.globalAlpha=activation*(strand?.64:1);ctx.strokeStyle=strand?'rgba(255,218,142,.92)':ctx.createLinearGradient(0,H*.95,0,H*.21);
  if(!strand){ctx.strokeStyle.addColorStop(0,'rgba(255,231,174,.98)');ctx.strokeStyle.addColorStop(.42,'rgba(115,232,255,.98)');ctx.strokeStyle.addColorStop(1,'rgba(255,223,154,.90)');}
  ctx.lineWidth=W*(front?(strand?.0045:.012): (strand?.0025:.007));ctx.shadowColor=front?'#86eaff':'#f8d28c';ctx.shadowBlur=W*(front?.022:.012);ctx.stroke();
 }
 const u=rise,theta=u*Math.PI*2*1.18-now*.0019,headFront=Math.cos(theta)>0;
 if(headFront===front){const rx=W*(.13+.24*Math.sin(Math.PI*u)),px=cx+Math.sin(theta)*rx,py=H*(.95-.74*u),r=W*(front?.027:.016),g=ctx.createRadialGradient(px,py,1,px,py,r);g.addColorStop(0,'rgba(255,255,241,.98)');g.addColorStop(.24,'rgba(255,221,145,.92)');g.addColorStop(.58,'rgba(100,226,255,.62)');g.addColorStop(1,'rgba(89,215,255,0)');ctx.globalAlpha=front?.95:.55;ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();}
 ctx.restore();
}
function drawRepairSpotlight(ctx,W,H,now,power){
 const cx=W*.5,sourceY=H*.965,shipY=H*.40,pulse=.78+.22*Math.sin(now*.0031),elapsed=(now-modeStartedAt)/1000,activation=smoothFx((elapsed-(repairFromBroken?.88:0))/.38);
 ctx.save();ctx.globalCompositeOperation='lighter';
 const cone=ctx.createLinearGradient(0,shipY,0,sourceY);
 cone.addColorStop(0,'rgba(255,230,169,0)');cone.addColorStop(.18,'rgba(119,224,255,'+(.055*power*activation)+')');cone.addColorStop(.42,'rgba(119,224,255,'+(.20*power*activation)+')');cone.addColorStop(.76,'rgba(255,205,107,'+(.43*power*pulse*activation)+')');cone.addColorStop(1,'rgba(255,246,209,'+(.78*power*pulse*activation)+')');
 ctx.filter='blur('+Math.max(3,W*.009)+'px)';
 ctx.fillStyle=cone;ctx.beginPath();ctx.moveTo(cx-W*.38,shipY);ctx.lineTo(cx+W*.38,shipY);ctx.lineTo(cx+W*.055,sourceY);ctx.lineTo(cx-W*.055,sourceY);ctx.closePath();ctx.fill();
 for(let i=0;i<4;i++){
  const sway=Math.sin(now*.0015+i*1.7)*W*.035,top=cx+(i-1.5)*W*.12+sway;
  const ray=ctx.createLinearGradient(0,shipY,0,sourceY);ray.addColorStop(0,'rgba(255,231,165,0)');ray.addColorStop(.72,'rgba(126,225,255,'+(.18*power*activation)+')');ray.addColorStop(1,'rgba(255,244,203,'+(.48*power*pulse*activation)+')');
  ctx.fillStyle=ray;ctx.beginPath();ctx.moveTo(top-W*.018,shipY);ctx.lineTo(top+W*.018,shipY);ctx.lineTo(cx+W*.026,sourceY);ctx.lineTo(cx-W*.026,sourceY);ctx.closePath();ctx.fill();
 }
 const glow=ctx.createRadialGradient(cx,sourceY-H*.012,1,cx,sourceY-H*.012,W*.25);
 glow.addColorStop(0,'rgba(255,252,226,'+(.88*power*pulse*activation)+')');glow.addColorStop(.18,'rgba(255,211,116,'+(.56*power*pulse*activation)+')');glow.addColorStop(.55,'rgba(99,221,255,'+(.24*power*pulse*activation)+')');glow.addColorStop(1,'rgba(70,208,255,0)');
 ctx.fillStyle=glow;ctx.fillRect(cx-W*.27,sourceY-H*.20,W*.54,H*.22);
 ctx.filter='none';drawRepairSpiral(ctx,W,H,now,false,power);
 ctx.restore();
}
function drawSmokeBehind(ctx,W,H,now,power){
 const elapsed=Math.max(0,(now-modeStartedAt)/1000),destroyed=visualMode==='destroyed';
 ctx.save();ctx.globalCompositeOperation='source-over';
 for(let i=0;i<(destroyed?27:12);i++){
  const phase=(elapsed*(destroyed?.23:.17)+i*.071)%1,lane=i%5;
  const originX=W*(.18+lane*.16),drift=Math.sin(now*.0007+i*1.91)*W*(.014+phase*.025);
  const px=originX+drift,py=H*(.82-phase*(destroyed?.48:.34));
  const r=W*(.014+phase*(destroyed?.06:.036)),alpha=(1-phase)*(destroyed?.43:.16)*Math.min(1.45,power);
  const g=ctx.createRadialGradient(px-r*.18,py-r*.2,1,px,py,r);
  g.addColorStop(0,'rgba(179,169,152,'+alpha+')');g.addColorStop(.42,'rgba(112,112,108,'+(alpha*.82)+')');g.addColorStop(.78,'rgba(53,59,62,'+(alpha*.56)+')');g.addColorStop(1,'rgba(37,45,50,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(px,py,r*.77,r*1.22,Math.sin(now*.001+i)*.16,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function drawSmokeFront(ctx,W,H,now,power){
 const elapsed=Math.max(0,(now-modeStartedAt)/1000);ctx.save();ctx.globalCompositeOperation='source-over';
 for(let i=0;i<4;i++){
  const baseX=W*(.34+i*.105)+Math.sin(now*.0008+i*1.6)*W*.012,baseY=H*(.80+(i%2)*.018),topY=baseY-H*(.27+(i%3)*.035),w=W*(.032+(i%2)*.009),a=.20*Math.min(1.3,power);
  const smoke=ctx.createLinearGradient(0,topY,0,baseY);smoke.addColorStop(0,'rgba(115,122,123,0)');smoke.addColorStop(.38,'rgba(144,137,122,'+(a*.72)+')');smoke.addColorStop(1,'rgba(71,68,62,'+a+')');
  ctx.save();ctx.filter='blur('+Math.max(6,W*.018)+'px)';ctx.fillStyle=smoke;ctx.beginPath();ctx.moveTo(baseX-w,baseY);ctx.bezierCurveTo(baseX-w*1.8,baseY-H*.11,baseX+w*.7,topY+H*.12,baseX-w*.25,topY);ctx.bezierCurveTo(baseX+w*1.3,topY+H*.08,baseX+w*1.7,baseY-H*.14,baseX+w,baseY);ctx.closePath();ctx.fill();ctx.restore();
 }
 for(let i=0;i<17;i++){
  const phase=(elapsed*.19+i*.079)%1,lane=i%5,px=W*(.27+lane*.115)+Math.sin(now*.0009+i*2.4)*W*(.012+phase*.018),py=H*(.80-phase*.46),r=W*(.024+phase*.048),a=(1-phase)*.43*Math.min(1.35,power);
  const g=ctx.createRadialGradient(px-r*.18,py-r*.2,1,px,py,r);g.addColorStop(0,'rgba(142,137,124,'+(a*.82)+')');g.addColorStop(.38,'rgba(85,87,84,'+(a*.86)+')');g.addColorStop(.74,'rgba(67,73,76,'+(a*.58)+')');g.addColorStop(1,'rgba(64,72,76,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(px,py,r*.78,r*1.24,Math.sin(now*.001+i)*.13,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function drawFire(ctx,W,H,now,power,elapsed){
 const sites=[.27,.38,.49,.60,.71,.82];ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=smoothFx(elapsed/.42);ctx.lineJoin='round';
 for(let i=0;i<sites.length;i++){
  const x=W*sites[i],y=H*(.805+(i%2)*.018),f=.72+.28*Math.sin(now*.012+i*2.3),h=H*(.125+power*.065)*f;
  ctx.shadowColor='#ff4b14';ctx.shadowBlur=W*(.027+.018*power);
  const outer=ctx.createLinearGradient(0,y-h,0,y+H*.012);outer.addColorStop(0,'rgba(255,246,173,.08)');outer.addColorStop(.3,'rgba(255,190,52,.86)');outer.addColorStop(.72,'rgba(255,81,20,.92)');outer.addColorStop(1,'rgba(133,28,14,.15)');
  ctx.fillStyle=outer;ctx.beginPath();ctx.moveTo(x-W*.032,y);ctx.bezierCurveTo(x-W*.044,y-h*.30,x-W*.014,y-h*.56,x-W*.006,y-h);ctx.bezierCurveTo(x+W*.010,y-h*.69,x+W*.012,y-h*.40,x+W*.038,y);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,246,190,.88)';ctx.beginPath();ctx.moveTo(x-W*.012,y);ctx.quadraticCurveTo(x-W*.010,y-h*.38,x+W*.004,y-h*.65);ctx.quadraticCurveTo(x+W*.018,y-h*.30,x+W*.014,y);ctx.closePath();ctx.fill();
 }
 ctx.restore();
}
function drawDebris(ctx,W,H,now,power,elapsed){
 ctx.save();ctx.globalCompositeOperation='source-over';
 for(let i=0;i<38;i++){
  const age=elapsed-i*.034;if(age<0||age>2.65)continue;
  const lane=i%7,sx=W*(.25+lane*.082),sy=H*(.775+(i%3)*.035),dir=(i%2?1:-1),vx=dir*W*(.14+(i%5)*.025),vy=-H*(.26+(i%4)*.055);
  const px=sx+vx*age,py=sy+vy*age+H*.11*age*age,angle=age*(3.4+(i%4));
  const fade=age>2.0?(2.65-age)/.65:1,r=W*(.011+(i%3)*.003);
  ctx.save();ctx.translate(px,py);ctx.rotate(angle);ctx.globalAlpha=fade;ctx.fillStyle=i%3===0?'#f3ae50':(i%2?'#75462d':'#b87a43');ctx.shadowColor=i%3===0?'#ff9c38':'transparent';ctx.shadowBlur=i%3===0?W*.006:0;
  ctx.beginPath();ctx.moveTo(-r*2,-r*.42);ctx.lineTo(r*1.8,-r*.8);ctx.lineTo(r*2.7,r*.1);ctx.lineTo(-r*.4,r*.65);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,199,112,.82)';ctx.lineWidth=Math.max(1,W*.0013);ctx.stroke();ctx.restore();
 }
 ctx.restore();
}
function drawBrokenShip(ctx,img,W,H,now,progressOverride){
 const elapsed=Math.max(0,(now-modeStartedAt)/1000),p=progressOverride===undefined?smoothFx(elapsed/.82):clampFx(progressOverride,0,1);
 const pieces=[
  {cx:.25,cy:.30,dx:-.065,dy:-.018,r:-.045,poly:[[0,0],[.50,0],[.46,.13],[.53,.23],[.46,.32],[.52,.41],[.47,.50],[.52,.59],[.40,.61],[.28,.58],[.14,.61],[0,.59]]},
  {cx:.75,cy:.30,dx:.065,dy:-.010,r:.05,poly:[[.50,0],[1,0],[1,.59],[.84,.61],[.72,.58],[.60,.61],[.52,.59],[.47,.50],[.52,.41],[.46,.32],[.53,.23],[.46,.13]]},
  {cx:.25,cy:.80,dx:-.040,dy:.040,r:-.035,poly:[[0,.59],[.14,.61],[.28,.58],[.40,.61],[.52,.59],[.47,.71],[.53,.80],[.47,.88],[.52,1],[0,1]]},
  {cx:.75,cy:.80,dx:.045,dy:.055,r:.045,poly:[[.52,.59],[.60,.61],[.72,.58],[.84,.61],[1,.59],[1,1],[.52,1],[.47,.88],[.53,.80],[.47,.71]]}
 ];
 for(const piece of pieces){
  const cx=piece.cx*W,cy=piece.cy*H;ctx.save();ctx.translate(cx+piece.dx*W*p,cy+piece.dy*H*p);ctx.rotate(piece.r*p);ctx.translate(-cx,-cy);
  ctx.beginPath();piece.poly.forEach((point,i)=>{const px=point[0]*W,py=point[1]*H;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);});ctx.closePath();ctx.clip();ctx.drawImage(img,0,0,W,H);ctx.restore();
 }
}
function drawImpactGlowBehind(ctx,W,H,now,power){
 const age=Math.max(0,(now-modeStartedAt)/1000);if(age>.5)return;
 const p=1-age/.5,x=W*.5,y=H*.79,r=W*(.045+age*.13),g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,'rgba(255,248,204,'+(.8*p)+')');g.addColorStop(.24,'rgba(255,173,61,'+(.65*p)+')');g.addColorStop(1,'rgba(255,84,23,0)');
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawRepairGoldGlints(ctx,W,H,now,power,progress){
 const glow=smoothFx((progress-.56)/.34)*(1-smoothFx((progress-.97)/.08));if(glow<.01)return;
 ctx.save();ctx.globalCompositeOperation='source-atop';
 for(let i=0;i<18;i++){
  const u=(i/18+now*.000055)%1,theta=u*Math.PI*2*1.18-now*.0019;if(Math.cos(theta)<0)continue;
  const x=W*.5+Math.sin(theta)*W*(.13+.24*Math.sin(Math.PI*u)),y=H*(.95-.74*u),pulse=.35+.65*(.5+.5*Math.sin(now*.006+i*2.4)),r=W*(.003+.004*pulse),g=ctx.createRadialGradient(x,y,0,x,y,r*3.5);
  g.addColorStop(0,'rgba(255,246,198,'+(.9*glow*pulse)+')');g.addColorStop(.38,'rgba(255,203,92,'+(.62*glow*pulse)+')');g.addColorStop(1,'rgba(255,190,74,0)');ctx.globalAlpha=Math.min(.7,.5*power);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.5,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function drawShipCondition(ctx,W,H,now,strength){
 const power=effectPower(strength),elapsed=Math.max(0,(now-modeStartedAt)/1000),cx=W*.5;
 if(visualMode==='repair'){
  const delay=repairFromBroken?.90:0,restored=smoothFx((elapsed-delay)/2.15),repairReady=smoothFx((elapsed-delay)/.36);ctx.save();ctx.globalCompositeOperation='source-atop';
  const hull=ctx.createRadialGradient(cx,H*.79,0,cx,H*.79,W*.3);hull.addColorStop(0,'rgba(255,232,153,'+(.25*power*repairReady*(1-restored*.38))+')');hull.addColorStop(.55,'rgba(104,227,237,'+(.12*power*repairReady*(1-restored*.5))+')');hull.addColorStop(1,'rgba(63,208,230,0)');ctx.fillStyle=hull;ctx.fillRect(0,H*.56,W,H*.44);ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<52;i++){
   const phase=(Math.max(0,elapsed-delay)*.34+i/52)%1,spread=.018+phase*.17,px=cx+Math.sin(now*.0018+i*2.17)*W*spread,py=H*(.95-phase*.56),pulse=.62+.38*Math.sin(now*.008+i*1.31),r=W*(.0032+(.0038*pulse)),alpha=Math.sin(Math.PI*phase)*power*(.48+.35*pulse)*repairReady;
   if(alpha<=0)continue;ctx.strokeStyle='rgba(142,237,255,'+(alpha*.45)+')';ctx.lineWidth=Math.max(1,W*.0015);ctx.beginPath();ctx.moveTo(px,py+r*3.5);ctx.lineTo(px,py+r*.4);ctx.stroke();
   const g=ctx.createRadialGradient(px,py,0,px,py,r*3.6);g.addColorStop(0,'rgba(255,255,224,'+Math.min(1,alpha)+')');g.addColorStop(.28,'rgba(132,238,255,'+Math.min(.9,alpha*.85)+')');g.addColorStop(1,'rgba(79,216,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r*3.6,0,Math.PI*2);ctx.fill();
   if(phase>.87&&i%3===0){ctx.fillStyle='rgba(255,238,170,'+(alpha*.65)+')';ctx.fillRect(px-r*2,py-r*.35,r*4,r*.7);ctx.fillRect(px-r*.35,py-r*2,r*.7,r*4);}
  }
  ctx.restore();drawRepairSpiral(ctx,W,H,now,true,power);drawRepairGoldGlints(ctx,W,H,now,power,restored);return;
 }
 if(visualMode==='damaged')return;
 if(visualMode!=='destroyed')return;
 drawDebris(ctx,W,H,now,power,elapsed);
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=0;i<30;i++){const phase=(elapsed*.42+i/30)%1,lane=i%6,px=W*(.27+lane*.09)+Math.sin(now*.002+i)*W*(.018+phase*.03),py=H*(.82-phase*.42),r=W*(.0025+(.003*(.5+.5*Math.sin(now*.013+i)))),a=(1-phase)*power*.72;ctx.shadowColor='#ff9a42';ctx.shadowBlur=r*5;ctx.fillStyle='rgba(255,197,96,'+a+')';ctx.beginPath();ctx.arc(px,py,r*2,0,Math.PI*2);ctx.fill();}
